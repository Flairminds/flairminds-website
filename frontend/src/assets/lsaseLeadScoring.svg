<svg width="800" height="440" viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A sales rep's phone showing a ranked lead list connects to a laptop dashboard displaying the composite lead score, on a light business background">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF4EC"/>
      <stop offset="100%" stop-color="#E4EEE9"/>
    </linearGradient>
    <linearGradient id="blobMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFE8DE"/>
      <stop offset="100%" stop-color="#BFE0D6"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123258"/>
      <stop offset="100%" stop-color="#0B1D35"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4831A"/>
      <stop offset="100%" stop-color="#0A9396"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#12324A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="440" fill="url(#bgGrad)"/>
  <circle cx="90" cy="90" r="150" fill="#F6EFCF"/>
  <path d="M 800 440 L 800 90 C 620 20, 470 140, 520 260 C 560 350, 700 380, 800 440 Z" fill="url(#blobMint)"/>

  <!-- top-right tag pill -->
  <g transform="translate(560,34)" filter="url(#cardShadow)">
    <rect width="210" height="34" rx="17" fill="#0A9396"/>
    <text x="105" y="22" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">AI-Powered Lead Scoring</text>
  </g>

  <!-- connecting wire from phone to laptop -->
  <path d="M 265 230 C 330 230, 340 190, 400 190 S 470 235, 545 235" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12"/>
  <circle cx="335" cy="205" r="5" fill="#C4831A"/>
  <circle cx="470" cy="221" r="5" fill="#0A9396"/>

  <!-- phone mockup: ranked lead list -->
  <g transform="translate(96,120)" filter="url(#cardShadow)">
    <rect width="168" height="248" rx="26" fill="#0B1D35"/>
    <rect x="8" y="8" width="152" height="232" rx="19" fill="#FFFFFF"/>
    <rect x="24" y="26" width="70" height="10" rx="5" fill="#0B1D35" fill-opacity="0.75"/>
    <rect x="24" y="42" width="50" height="7" rx="3.5" fill="#8A93A0"/>

    <g transform="translate(24,64)">
      <rect width="120" height="46" rx="10" fill="#FDF6E8" stroke="#E3A63E" stroke-opacity="0.5"/>
      <circle cx="16" cy="23" r="6" fill="#C4831A"/>
      <rect x="30" y="14" width="60" height="7" rx="3.5" fill="#374151"/>
      <rect x="30" y="27" width="40" height="6" rx="3" fill="#8A93A0"/>
      <text x="112" y="27" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#C4831A">742</text>
    </g>
    <g transform="translate(24,118)">
      <rect width="120" height="46" rx="10" fill="#EAF6F5" stroke="#0A9396" stroke-opacity="0.4"/>
      <circle cx="16" cy="23" r="6" fill="#0A9396"/>
      <rect x="30" y="14" width="60" height="7" rx="3.5" fill="#374151"/>
      <rect x="30" y="27" width="40" height="6" rx="3" fill="#8A93A0"/>
      <text x="112" y="27" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#0A9396">480</text>
    </g>
    <g transform="translate(24,172)">
      <rect width="120" height="46" rx="10" fill="#F7F8FA" stroke="#CDD2D9"/>
      <circle cx="16" cy="23" r="6" fill="#B23A2E"/>
      <rect x="30" y="14" width="60" height="7" rx="3.5" fill="#9CA3AF"/>
      <rect x="30" y="27" width="40" height="6" rx="3" fill="#C3C9D2"/>
      <text x="112" y="27" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#B23A2E">220</text>
    </g>
  </g>

  <!-- laptop mockup: dashboard -->
  <g transform="translate(400,110)" filter="url(#cardShadow)">
    <rect width="300" height="188" rx="12" fill="url(#screenGrad)"/>
    <rect x="14" y="14" width="272" height="160" rx="6" fill="#F7F8FA"/>

    <text x="26" y="34" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#0B1D35">Composite score distribution</text>

    <g transform="translate(26,48)">
      <rect x="0" y="58" width="30" height="30" rx="4" fill="#9DC3F2"/>
      <rect x="40" y="40" width="30" height="48" rx="4" fill="#5598e7"/>
      <rect x="80" y="16" width="30" height="72" rx="4" fill="#E3A63E"/>
      <rect x="120" y="44" width="30" height="44" rx="4" fill="#5598e7"/>
      <rect x="160" y="66" width="30" height="22" rx="4" fill="#1c5cab"/>
    </g>

    <g transform="translate(226,52)">
      <circle r="34" fill="none" stroke="#E5E7EB" stroke-width="8"/>
      <path d="M 0 -34 A 34 34 0 1 1 -22 26" fill="none" stroke="#C4831A" stroke-width="8" stroke-linecap="round"/>
      <text x="0" y="5" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="15" font-weight="800" fill="#0B1D35">742</text>
    </g>

    <rect x="14" y="176" width="272" height="1" fill="#0B1D35" fill-opacity="0"/>
    <g transform="translate(60,-4)">
      <circle cx="0" cy="-2" r="2.2" fill="#ffffff" fill-opacity="0.5"/>
    </g>
    <circle cx="26" cy="6" r="3" fill="#EF4444" fill-opacity="0.7"/>
    <circle cx="38" cy="6" r="3" fill="#F59E0B" fill-opacity="0.7"/>
    <circle cx="50" cy="6" r="3" fill="#22C55E" fill-opacity="0.7"/>

    <path d="M -20 188 L 320 188 L 340 210 L -40 210 Z" fill="#0B1D35"/>
  </g>

  <!-- bottom caption band -->
  <g transform="translate(0,352)">
    <rect x="0" y="0" width="800" height="88" fill="#FFFFFF" fill-opacity="0.94"/>
    <rect x="40" y="20" width="46" height="46" rx="10" fill="#C4831A"/>
    <circle cx="63" cy="43" r="14" fill="none" stroke="#FFFFFF" stroke-width="3.4"/>
    <circle cx="63" cy="43" r="3.4" fill="#FFFFFF"/>

    <text x="104" y="42" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="800" fill="#0B1D35">Know which lead to call first.</text>
    <text x="104" y="64" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#5B6472">Explainable 1–1000 priority scoring for trading &amp; brokerage sales teams.</text>

    <g transform="translate(680,26)" fill="none" stroke="#0B1D35" stroke-opacity="0.55" stroke-width="1.6">
      <rect x="0" y="0" width="26" height="34" rx="3"/>
      <line x1="6" y1="9" x2="20" y2="9"/>
      <line x1="6" y1="16" x2="20" y2="16"/>
      <line x1="6" y1="23" x2="14" y2="23"/>
    </g>
    <text x="722" y="47" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" fill="#0B1D35" fill-opacity="0.6">+</text>
    <g transform="translate(738,26)" fill="none" stroke="#0B1D35" stroke-opacity="0.55" stroke-width="1.6">
      <path d="M0 34 V20 M8 34 V12 M16 34 V4"/>
    </g>
  </g>
</svg>
