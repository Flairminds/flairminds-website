# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        run: npm install

      - name: Build frontend
        run: |
         cd frontend
         npm install
         npm run build
         cd ..
         rm -rf dist
         mv frontend/dist dist

      - name: Trim build artifact
        # index.js only needs the repo-root node_modules (Express etc.) and
        # dist/ at runtime. frontend/node_modules (~600MB+) and .git are
        # dev-time-only weight that bloated the deploy zip enough to cause
        # Kudu 504 timeouts on `az webapp deploy`.
        run: |
         rm -rf frontend/node_modules
         rm -rf .git
         rm -f "site 3.html"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BE09C4C671724F30BA3D72BE42C347C9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B7564F0F2D824A15B243011F37BFBDE4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F1DAF8C807074433813C25EAF4564CBA }}

      - name: Zip artifact for deployment
        run: zip -r app.zip . -x 'app.zip'

      - name: 'Deploy to Azure Web App (clean)'
        id: deploy-to-webapp
        run: |
          RG=$(az webapp list --query "[?name=='store'].resourceGroup" -o tsv | head -n1)
          if [ -z "$RG" ]; then
            echo "Could not resolve resource group for Web App 'store'" >&2
            exit 1
          fi
          # --clean true wipes /home/site/wwwroot before extracting the new
          # zip, so files removed or renamed in this deploy (e.g. the old
          # per-route "<slug>/index.html" prerender snapshots superseded by
          # flat "<slug>.html" files) can't linger and shadow the new ones.
          # No --slot: this app has no named deployment slots, so the
          # default/production slot is implicit (matches the previous
          # step's slot-name: 'Production', which is that action's way of
          # saying the same thing).
          az webapp deploy \
            --resource-group "$RG" \
            --name store \
            --src-path app.zip \
            --type zip \
            --clean true \
            --restart true \
            --timeout 1800
